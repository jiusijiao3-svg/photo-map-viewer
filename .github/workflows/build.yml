                      textSize = 9f
                      setBackgroundColor(Color.parseColor("#66000000"))
                      setPadding(4.dp(), 2.dp(), 4.dp(), 2.dp())
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM or Gravity.END).apply { setMargins(6.dp(), 6.dp(), 6.dp(), 6.dp()) }
