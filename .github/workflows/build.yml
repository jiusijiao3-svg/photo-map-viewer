              private fun toggleViewOrder() {
                  isMapOnTop = !isMapOnTop
                  (thumbContainer.parent as? ViewGroup)?.removeView(thumbContainer)
                  (mapWebView.parent as? ViewGroup)?.removeView(mapWebView)

                  if (isMapOnTop) {
