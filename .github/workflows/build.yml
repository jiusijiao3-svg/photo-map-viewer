name: Build PhotoMapViewer APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 17 のセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Android SDK ライセンスの自動承諾
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: プロジェクト構造とソースコードの一括生成
        run: |
          mkdir -p app/src/main/java/com/example/photomapviewer
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PhotoMapViewer"
          include(":app")
          EOF

          # 3. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.photomapviewer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.photomapviewer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
              implementation("androidx.documentfile:documentfile:1.0.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
          }
          EOF

          # 5. app/src/main/res/values/styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar" />
          </resources>
          EOF

          # 6. app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:label="PhotoMapViewer"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. app/src/main/java/com/example/photomapviewer/MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/photomapviewer/MainActivity.kt
          package com.example.photomapviewer

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.DialogInterface
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.text.InputType
          import android.util.LruCache
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.AbsListView
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.documentfile.provider.DocumentFile
          import androidx.exifinterface.media.ExifInterface
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : AppCompatActivity() {

              data class PhotoItem(
                  val uri: Uri,
                  val name: String,
                  val lastModified: Long,
                  var lat: Double? = null,
                  var lon: Double? = null,
                  var debugStatus: String = ""
              )

              private val photoList = mutableListOf<PhotoItem>()
              private var currentIndex = 0
              private var isMapReady = false

              // 設定値
              private var isSortDesc = true
              private var pinLimitCount = 50
              private var cacheLimitMb = 100
              private var startupMode = 0

              private lateinit var ivThumbnail: ImageView
              private lateinit var tvImageInfo: TextView
              private lateinit var mapWebView: WebView
              private lateinit var btnNewer: Button
              private lateinit var btnOlder: Button
              private lateinit var btnGsi: Button
              private lateinit var btnGoogleMap: Button

              // 全画面オーバーレイ
              private lateinit var fullContainer: FrameLayout
              private lateinit var fullImageView: ImageView

              private fun Int.dp(): Int = (this * resources.displayMetrics.density).toInt()

              // メモリキャッシュ
              private val memoryCache: LruCache<String, Bitmap> by lazy {
                  val maxMem = (Runtime.getRuntime().maxMemory() / 1024L).toInt()
                  val cacheSize = maxOf(1024, maxMem / 8)
                  object : LruCache<String, Bitmap>(cacheSize) {
                      override fun sizeOf(key: String, bitmap: Bitmap): Int = bitmap.byteCount / 1024
                  }
              }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { checkAutoResume() }

              private val folderPicker = registerForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      )
                      getSharedPreferences("app_settings", Context.MODE_PRIVATE)
                          .edit().putString("last_folder_uri", uri.toString()).apply()
                      loadPhotosFromFolder(uri, null)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  loadSettings()

                  val rootContainer = FrameLayout(this).apply {
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(8.dp(), 8.dp(), 8.dp(), 8.dp())
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  // 1. 最上部バー: [ ≡ ] [ |◀ 先頭 ] [ 📁 フォルダ選択 ]
                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 48.dp())
                  }

                  val btnSettings = Button(this).apply {
                      text = "≡"
                      textSize = 20f
                      setBackgroundColor(Color.parseColor("#383838"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(48.dp(), ViewGroup.LayoutParams.MATCH_PARENT).apply {
                          marginEnd = 4.dp()
                      }
                      setOnClickListener { showMainMenu() }
                  }
                  topRow.addView(btnSettings)

                  val btnTopPhoto = Button(this).apply {
                      text = "|◀ 先頭"
                      textSize = 12f
                      setBackgroundColor(Color.parseColor("#383838"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(70.dp(), ViewGroup.LayoutParams.MATCH_PARENT).apply {
                          marginEnd = 4.dp()
                      }
                      setOnClickListener {
                          if (photoList.isNotEmpty()) {
                              navigateTo(0)
                          } else {
                              Toast.makeText(this@MainActivity, "写真が読み込まれていません", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  topRow.addView(btnTopPhoto)

                  val btnSelectFolder = Button(this).apply {
                      text = "📁 フォルダ選択"
                      textSize = 13f
                      setBackgroundColor(Color.parseColor("#2D2D2D"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setOnClickListener { folderPicker.launch(null) }
                  }
                  topRow.addView(btnSelectFolder)
                  mainLayout.addView(topRow)

                  // 2. サムネイル枠
                  val thumbContainer = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 210.dp()).apply {
                          topMargin = 6.dp()
                      }
                      setBackgroundColor(Color.BLACK)
                      isClickable = true
                      isFocusable = true
                      setOnClickListener { openFullScreen() }
                  }

                  ivThumbnail = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setOnClickListener { openFullScreen() }
                  }
                  thumbContainer.addView(ivThumbnail)

                  tvImageInfo = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      setBackgroundColor(Color.parseColor("#99000000"))
                      setPadding(6.dp(), 4.dp(), 6.dp(), 4.dp())
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP or Gravity.START).apply {
                          setMargins(6.dp(), 6.dp(), 6.dp(), 6.dp())
                      }
                  }
                  thumbContainer.addView(tvImageInfo)
                  mainLayout.addView(thumbContainer)

                  // 3. 中段ボタン
                  val midRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 44.dp()).apply {
                          topMargin = 6.dp()
                      }
                  }

                  btnGsi = Button(this).apply {
                      text = "国土地理院で開く"
                      textSize = 12f
                      setBackgroundColor(Color.parseColor("#333333"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { marginEnd = 4.dp() }
                      setOnClickListener { openInGsiMap() }
                  }
                  btnGoogleMap = Button(this).apply {
                      text = "Googleマップで開く"
                      textSize = 12f
                      setBackgroundColor(Color.parseColor("#333333"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { marginStart = 4.dp() }
                      setOnClickListener { openInGoogleMap() }
                  }
                  midRow.addView(btnGsi)
                  midRow.addView(btnGoogleMap)
                  mainLayout.addView(midRow)

                  // 4. 地図ビュー
                  mapWebView = WebView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f).apply {
                          topMargin = 6.dp()
                          bottomMargin = 6.dp()
                      }
                  }
                  mainLayout.addView(mapWebView)

                  // 5. 下段ボタン
                  val btmRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 48.dp())
                  }

                  btnNewer = Button(this).apply {
                      text = "◀ 新しい写真"
                      textSize = 12f
                      setBackgroundColor(Color.parseColor("#2D2D2D"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { marginEnd = 4.dp() }
                      setOnClickListener {
                          val targetIndex = if (isSortDesc) currentIndex - 1 else currentIndex + 1
                          navigateTo(targetIndex)
                      }
                  }
                  btnOlder = Button(this).apply {
                      text = "古い写真 ▶"
                      textSize = 12f
                      setBackgroundColor(Color.parseColor("#2D2D2D"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { marginStart = 4.dp() }
                      setOnClickListener {
                          val targetIndex = if (isSortDesc) currentIndex + 1 else currentIndex - 1
                          navigateTo(targetIndex)
                      }
                  }
                  btmRow.addView(btnNewer)
                  btmRow.addView(btnOlder)
                  mainLayout.addView(btmRow)

                  rootContainer.addView(mainLayout)

                  // 6. 最前面全画面レイアウト
                  fullContainer = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      setBackgroundColor(Color.BLACK)
                      visibility = View.GONE
                      setOnClickListener { closeFullScreen() }
                  }

                  fullImageView = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setOnClickListener { closeFullScreen() }
                  }
                  fullContainer.addView(fullImageView)
                  rootContainer.addView(fullContainer)

                  setContentView(rootContainer)
                  setupWebView()

                  // 【重要】画面部品がすべて生成された最後に権限確認と自動復帰を呼ぶ
                  checkPermissions()
              }

              private fun loadSettings() {
                  val prefs = getSharedPreferences("app_settings", Context.MODE_PRIVATE)
                  isSortDesc = prefs.getBoolean("sort_desc", true)
                  pinLimitCount = prefs.getInt("pin_limit_count", 50)
                  cacheLimitMb = prefs.getInt("cache_limit_mb", 100)
                  startupMode = prefs.getInt("startup_mode", 0)
              }

              private fun saveSettings() {
                  getSharedPreferences("app_settings", Context.MODE_PRIVATE).edit()
                      .putBoolean("sort_desc", isSortDesc)
                      .putInt("pin_limit_count", pinLimitCount)
                      .putInt("cache_limit_mb", cacheLimitMb)
                      .putInt("startup_mode", startupMode)
                      .apply()
              }

              private fun checkAutoResume() {
                  if (startupMode == 2) return
                  val prefs = getSharedPreferences("app_settings", Context.MODE_PRIVATE)
                  val lastFolder = prefs.getString("last_folder_uri", null) ?: return
                  val lastPhoto = prefs.getString("last_photo_name", null)

                  val uri = Uri.parse(lastFolder)
                  val hasPerm = contentResolver.persistedUriPermissions.any { it.uri == uri && it.isReadPermission }
                  if (hasPerm) {
                      val targetName = if (startupMode == 0) lastPhoto else null
                      loadPhotosFromFolder(uri, targetName)
                  }
              }

              private fun showMainMenu() {
                  val items = arrayOf(
                      "📁 ファイル操作 ▶",
                      "📍 地図ピン表示 ▶",
                      "💾 キャッシュ管理 ▶",
                      "⚙️ 起動時の設定 ▶"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("メニュー")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showFileMenu()
                              1 -> showPinMenu()
                              2 -> showCacheMenu()
                              3 -> showStartupMenu()
                          }
                      }
                      .setNegativeButton("閉じる", null)
                      .show()
              }

              private fun showFileMenu() {
                  val sortLabel = if (isSortDesc) "新しい順 (降順)" else "古い順 (昇順)"
                  val items = arrayOf(
                      "🖼️ サムネイル一覧から選択",
                      "📑 ファイル名一覧から選択",
                      "並び順: $sortLabel"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("ファイル操作")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showThumbnailGridPicker()
                              1 -> showFileNamePicker()
                              2 -> showSortDialog()
                          }
                      }
                      .setNegativeButton("戻る") { _, _ -> showMainMenu() }
                      .show()
              }

              private fun showThumbnailGridPicker() {
                  if (photoList.isEmpty()) {
                      Toast.makeText(this, "先にフォルダを選択してください", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val dialogView = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                  }
                  val gridView = GridView(this).apply {
                      numColumns = 3
                      stretchMode = GridView.STRETCH_COLUMN_WIDTH
                      verticalSpacing = 4.dp()
                      horizontalSpacing = 4.dp()
                      setPadding(4.dp(), 4.dp(), 4.dp(), 4.dp())
                  }
                  dialogView.addView(gridView)

                  var dialogRef: AlertDialog? = null
                  val cellSize = (resources.displayMetrics.widthPixels - 36.dp()) / 3

                  gridView.adapter = object : BaseAdapter() {
                      override fun getCount(): Int = photoList.size
                      override fun getItem(position: Int): Any = photoList[position]
                      override fun getItemId(position: Int): Long = position.toLong()

                      override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                          val frame: FrameLayout
                          val img: ImageView
                          val badge: TextView

                          if (convertView == null) {
                              frame = FrameLayout(this@MainActivity).apply {
                                  layoutParams = AbsListView.LayoutParams(cellSize, cellSize)
                                  setBackgroundColor(Color.BLACK)
                              }
                              img = ImageView(this@MainActivity).apply {
                                  layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                                  scaleType = ImageView.ScaleType.CENTER_CROP
                              }
                              badge = TextView(this@MainActivity).apply {
                                  textSize = 10f
                                  setTextColor(Color.WHITE)
                                  setBackgroundColor(Color.parseColor("#99000000"))
                                  setPadding(4.dp(), 2.dp(), 4.dp(), 2.dp())
                                  layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM or Gravity.START)
                              }
                              frame.addView(img)
                              frame.addView(badge)
                          } else {
                              frame = convertView as FrameLayout
                              img = frame.getChildAt(0) as ImageView
                              badge = frame.getChildAt(1) as TextView
                          }

                          val item = photoList[position]
                          badge.text = "${position + 1}${if (item.lat != null) " 📍" else ""}"

                          if (position == currentIndex) {
                              frame.setPadding(3.dp(), 3.dp(), 3.dp(), 3.dp())
                              frame.setBackgroundColor(Color.parseColor("#0066FF"))
                          } else {
                              frame.setPadding(0, 0, 0, 0)
                              frame.setBackgroundColor(Color.BLACK)
                          }

                          val cacheKey = "${item.uri}_grid"
                          val cachedBmp = memoryCache.get(cacheKey)
                          if (cachedBmp != null) {
                              img.setImageBitmap(cachedBmp)
                          } else {
                              img.setImageDrawable(null)
                              img.tag = item.uri
                              lifecycleScope.launch(Dispatchers.IO) {
                                  val bmp = decodeSampledBitmap(item.uri, cellSize, cellSize)
                                  if (bmp != null) {
                                      memoryCache.put(cacheKey, bmp)
                                      withContext(Dispatchers.Main) {
                                          if (img.tag == item.uri) {
                                              img.setImageBitmap(bmp)
                                          }
                                      }
                                  }
                              }
                          }

                          frame.setOnClickListener {
                              dialogRef?.dismiss()
                              navigateTo(position)
                          }
                          return frame
                      }
                  }

                  val builtDialog = AlertDialog.Builder(this)
                      .setTitle("写真を選択 (全${photoList.size}枚)")
                      .setView(dialogView)
                      .setNegativeButton("キャンセル", null)
                      .create()

                  dialogRef = builtDialog
                  builtDialog.show()
              }

              private fun showFileNamePicker() {
                  if (photoList.isEmpty()) {
                      Toast.makeText(this, "先にフォルダを選択してください", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val names = photoList.mapIndexed { idx, p ->
                      val prefix = if (idx == currentIndex) "▶ " else "   "
                      val gps = if (p.lat != null) " [GPS]" else ""
                      "$prefix[${idx + 1}] ${p.name}$gps"
                  }.toTypedArray()

                  AlertDialog.Builder(this)
                      .setTitle("ファイル名一覧から選択")
                      .setItems(names) { _, which -> navigateTo(which) }
                      .setNegativeButton("戻る") { _, _ -> showFileMenu() }
                      .show()
              }

              private fun showSortDialog() {
                  val options = arrayOf("新しい順 (降順)", "古い順 (昇順)")
                  val currentSelection = if (isSortDesc) 0 else 1
                  AlertDialog.Builder(this)
                      .setTitle("ファイルの並び順")
                      .setSingleChoiceItems(options, currentSelection) { dialog, which ->
                          isSortDesc = (which == 0)
                          saveSettings()
                          applySort()
                          dialog.dismiss()
                      }
                      .show()
              }

              private fun showPinMenu() {
                  val options = arrayOf(
                      "50枚",
                      "100枚",
                      "全て表示",
                      "手動設定 (${if (pinLimitCount !in listOf(50, 100, -1)) "${pinLimitCount}枚" else "枚数を指定"})"
                  )
                  val currentIdx = when (pinLimitCount) {
                      50 -> 0
                      100 -> 1
                      -1 -> 2
                      else -> 3
                  }

                  AlertDialog.Builder(this)
                      .setTitle("地図ピン表示件数")
                      .setSingleChoiceItems(options, currentIdx) { dialog, which ->
                          when (which) {
                              0 -> { pinLimitCount = 50; finishPinChange(dialog) }
                              1 -> { pinLimitCount = 100; finishPinChange(dialog) }
                              2 -> { pinLimitCount = -1; finishPinChange(dialog) }
                              3 -> {
                                  dialog.dismiss()
                                  showCustomPinDialog()
                              }
                          }
                      }
                      .setNegativeButton("戻る") { _, _ -> showMainMenu() }
                      .show()
              }

              private fun finishPinChange(dialog: DialogInterface) {
                  saveSettings()
                  renderCurrentPhotoOnMap()
                  dialog.dismiss()
              }

              private fun showCustomPinDialog() {
                  val input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      hint = "表示したい枚数を入力 (例: 200)"
                      if (pinLimitCount > 0) setText(pinLimitCount.toString())
                  }
                  AlertDialog.Builder(this)
                      .setTitle("手動設定 (枚数指定)")
                      .setView(input)
                      .setPositiveButton("決定") { _, _ ->
                          val count = input.text.toString().toIntOrNull()
                          if (count != null && count > 0) {
                              pinLimitCount = count
                              saveSettings()
                              renderCurrentPhotoOnMap()
                          } else {
                              Toast.makeText(this, "正しい数値を入力してください", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("キャンセル") { _, _ -> showPinMenu() }
                      .show()
              }

              private fun showCacheMenu() {
                  val limitStr = if (cacheLimitMb > 0) "${cacheLimitMb} MB" else "無制限"
                  val items = arrayOf(
                      "キャッシュ上限設定: $limitStr",
                      "🗑️ 地図タイルキャッシュ消去",
                      "🗑️ Exifメタデータ消去"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("キャッシュ管理")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showCacheLimitDialog()
                              1 -> clearTileCache()
                              2 -> clearMetadataCache()
                          }
                      }
                      .setNegativeButton("戻る") { _, _ -> showMainMenu() }
                      .show()
              }

              private fun showCacheLimitDialog() {
                  val options = arrayOf("50 MB", "100 MB (推奨)", "250 MB", "500 MB", "無制限")
                  val values = listOf(50, 100, 250, 500, -1)
                  val currentIdx = values.indexOf(cacheLimitMb).let { if (it >= 0) it else 1 }

                  AlertDialog.Builder(this)
                      .setTitle("地図キャッシュ上限容量")
                      .setSingleChoiceItems(options, currentIdx) { dialog, which ->
                          cacheLimitMb = values[which]
                          saveSettings()
                          lifecycleScope.launch(Dispatchers.IO) { trimTileCacheIfNeeded() }
                          dialog.dismiss()
                      }
                      .setNegativeButton("戻る") { _, _ -> showCacheMenu() }
                      .show()
              }

              private fun clearTileCache() {
                  lifecycleScope.launch(Dispatchers.IO) {
                      val tileDir = File(cacheDir, "tiles")
                      if (tileDir.exists()) tileDir.deleteRecursively()
                      withContext(Dispatchers.Main) {
                          Toast.makeText(this@MainActivity, "地図タイルを消去しました", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun clearMetadataCache() {
                  getSharedPreferences("exif_metadata_cache", Context.MODE_PRIVATE).edit().clear().apply()
                  Toast.makeText(this, "Exifキャッシュを消去しました (次回フル解析)", Toast.LENGTH_SHORT).show()
              }

              private fun showStartupMenu() {
                  val options = arrayOf(
                      "前回最後に見ていた写真を開く",
                      "フォルダの先頭ファイルを開く",
                      "自動で開かない (手動でフォルダ選択)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("起動時の動作")
                      .setSingleChoiceItems(options, startupMode) { dialog, which ->
                          startupMode = which
                          saveSettings()
                          dialog.dismiss()
                      }
                      .setNegativeButton("戻る") { _, _ -> showMainMenu() }
                      .show()
              }

              private fun openFullScreen() {
                  if (photoList.isEmpty()) return
                  val item = photoList.getOrNull(currentIndex) ?: return

                  ivThumbnail.drawable?.let { fullImageView.setImageDrawable(it) }
                  fullContainer.visibility = View.VISIBLE

                  lifecycleScope.launch(Dispatchers.IO) {
                      val bmp = decodeSampledBitmap(item.uri, 2560, 2560)
                      withContext(Dispatchers.Main) {
                          if (fullContainer.visibility == View.VISIBLE && bmp != null) {
                              fullImageView.setImageBitmap(bmp)
                          }
                      }
                  }
              }

              private fun closeFullScreen() {
                  fullContainer.visibility = View.GONE
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (::fullContainer.isInitialized && fullContainer.visibility == View.VISIBLE) {
                      closeFullScreen()
                      return
                  }
                  super.onBackPressed()
              }

              private fun decodeSampledBitmap(uri: Uri, reqWidth: Int, reqHeight: Int): Bitmap? {
                  return try {
                      contentResolver.openInputStream(uri)?.use { stream ->
                          val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeStream(stream, null, options)

                          val rawWidth = options.outWidth
                          val rawHeight = options.outHeight

                          var inSample = 1
                          if (rawWidth > reqWidth || rawHeight > reqHeight) {
                              val halfWidth = rawWidth / 2
                              val halfHeight = rawHeight / 2
                              while ((halfWidth / inSample) >= reqWidth && (halfHeight / inSample) >= reqHeight) {
                                  inSample *= 2
                              }
                          }

                          val decodeOpts = BitmapFactory.Options().apply { inSampleSize = inSample }
                          contentResolver.openInputStream(uri)?.use { s2 ->
                              BitmapFactory.decodeStream(s2, null, decodeOpts)
                          }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun trimTileCacheIfNeeded() {
                  if (cacheLimitMb <= 0) return
                  val tileDir = File(cacheDir, "tiles")
                  if (!tileDir.exists()) return

                  val files = tileDir.listFiles() ?: return
                  var total = files.sumOf { it.length() }
                  val maxBytes = cacheLimitMb * 1024L * 1024L

                  if (total > maxBytes) {
                      val sorted = files.sortedBy { it.lastModified() }
                      val target = (maxBytes * 0.8).toLong()
                      for (f in sorted) {
                          val len = f.length()
                          if (f.delete()) {
                              total -= len
                              if (total <= target) break
                          }
                      }
                  }
              }

              private fun checkPermissions() {
                  val permissions = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_MEDIA_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          permissions.add(Manifest.permission.ACCESS_MEDIA_LOCATION)
                      }
                  }
                  if (permissions.isNotEmpty()) {
                      permissionLauncher.launch(permissions.toTypedArray())
                  } else {
                      checkAutoResume()
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  mapWebView.settings.javaScriptEnabled = true
                  mapWebView.settings.domStorageEnabled = true
                  mapWebView.addJavascriptInterface(WebAppInterface(), "Android")

                  mapWebView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          isMapReady = true
                          renderCurrentPhotoOnMap()
                      }

                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val url = request?.url?.toString() ?: return super.shouldInterceptRequest(view, request)
                          if (url.contains("cyberjapandata.gsi.go.jp")) {
                              try {
                                  val tileDir = File(cacheDir, "tiles")
                                  if (!tileDir.exists()) tileDir.mkdirs()

                                  val fileName = url.hashCode().toString() + if (url.endsWith(".png")) ".png" else ".jpg"
                                  val cacheFile = File(tileDir, fileName)

                                  if (cacheFile.exists() && cacheFile.length() > 0) {
                                      val mime = if (url.endsWith(".png")) "image/png" else "image/jpeg"
                                      return WebResourceResponse(mime, "UTF-8", FileInputStream(cacheFile))
                                  }

                                  val conn = URL(url).openConnection() as HttpURLConnection
                                  conn.connectTimeout = 4000
                                  conn.readTimeout = 4000
                                  conn.connect()
                                  if (conn.responseCode == 200) {
                                      val bytes = conn.inputStream.readBytes()
                                      FileOutputStream(cacheFile).use { it.write(bytes) }
                                      lifecycleScope.launch(Dispatchers.IO) { trimTileCacheIfNeeded() }
                                      val mime = if (url.endsWith(".png")) "image/png" else "image/jpeg"
                                      return WebResourceResponse(mime, "UTF-8", ByteArrayInputStream(bytes))
                                  }
                              } catch (e: Exception) { }
                          }
                          return super.shouldInterceptRequest(view, request)
                      }
                  }

                  val htmlContent = """
                      <!DOCTYPE html>
                      <html>
                      <head>
                          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
                          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
                          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
                          <style>
                              html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background: #1a1a1a; }
                          </style>
                      </head>
                      <body>
                          <div id="map"></div>
                          <script>
                              var stdLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                                  maxZoom: 18, attribution: '地理院タイル'
                              });
                              var photoLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
                                  maxZoom: 18, attribution: '航空写真'
                              });

                              var map = L.map('map', {
                                  center: [34.722690, 135.017698],
                                  zoom: 17,
                                  layers: [stdLayer],
                                  zoomControl: true
                              });

                              var baseMaps = {
                                  "標準地図": stdLayer,
                                  "衛星写真": photoLayer
                              };
                              L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

                              var markerLayer = L.layerGroup().addTo(map);

                              function updatePoints(targetLat, targetLon, hasCoords, allPointsJson, currentIndex) {
                                  markerLayer.clearLayers();
                                  var points = JSON.parse(allPointsJson);

                                  points.forEach(function(p) {
                                      if (p.hasGps && !p.isCurrent) {
                                          L.circleMarker([p.lat, p.lon], {
                                              radius: 7,
                                              color: '#ff3333',
                                              fillColor: '#ff0000',
                                              fillOpacity: 0.85,
                                              weight: 2
                                          }).addTo(markerLayer);

                                          var hitArea = L.circleMarker([p.lat, p.lon], {
                                              radius: 22,
                                              opacity: 0,
                                              fillOpacity: 0
                                          }).addTo(markerLayer);

                                          hitArea.on('click', function() {
                                              Android.onMarkerClicked(p.index);
                                          });
                                      }
                                  });

                                  if (hasCoords) {
                                      L.circleMarker([targetLat, targetLon], {
                                          radius: 10,
                                          color: '#ffffff',
                                          fillColor: '#0066ff',
                                          fillOpacity: 0.95,
                                          weight: 3
                                      }).addTo(markerLayer);

                                      var currentHit = L.circleMarker([targetLat, targetLon], {
                                          radius: 24,
                                          opacity: 0,
                                          fillOpacity: 0
                                      }).addTo(markerLayer);

                                      currentHit.on('click', function() {
                                          Android.onMarkerClicked(currentIndex);
                                      });

                                      map.panTo([targetLat, targetLon], { animate: true, duration: 0.4 });
                                  }
                              }
                          </script>
                      </body>
                      </html>
                  """.trimIndent()

                  mapWebView.loadDataWithBaseURL("https://maps.gsi.go.jp", htmlContent, "text/html", "UTF-8", null)
              }

              private fun loadPhotosFromFolder(folderUri: Uri, restorePhotoName: String?) {
                  lifecycleScope.launch {
                      tvImageInfo.text = "フォルダ内を検索中..."
                      ivThumbnail.setImageDrawable(null)

                      val files = withContext(Dispatchers.IO) {
                          try {
                              val rootDoc = DocumentFile.fromTreeUri(this@MainActivity, folderUri)
                              rootDoc?.listFiles()?.filter {
                                  it.isFile && (it.name?.endsWith(".jpg", true) == true || it.name?.endsWith(".jpeg", true) == true)
                              } ?: emptyList()
                          } catch (e: Exception) {
                              emptyList()
                          }
                      }

                      if (files.isEmpty()) {
                          Toast.makeText(this@MainActivity, "写真が見つかりませんでした", Toast.LENGTH_SHORT).show()
                          tvImageInfo.text = "写真なし"
                          return@launch
                      }

                      photoList.clear()
                      val total = files.size

                      withContext(Dispatchers.IO) {
                          val prefs = getSharedPreferences("exif_metadata_cache", Context.MODE_PRIVATE)
                          val editor = prefs.edit()

                          files.forEachIndexed { idx, file ->
                              val item = PhotoItem(file.uri, file.name ?: "", file.lastModified())
                              val cacheKey = "${file.name}_${file.lastModified()}"
                              val cachedData = prefs.getString(cacheKey, null)

                              if (cachedData != null) {
                                  if (cachedData != "NO_GPS") {
                                      val parts = cachedData.split(",")
                                      if (parts.size >= 2) {
                                          item.lat = parts[0].toDoubleOrNull()
                                          item.lon = parts[1].toDoubleOrNull()
                                          item.debugStatus = "OK"
                                      }
                                  } else {
                                      item.debugStatus = "GPSタグなし"
                                  }
                              } else {
                                  try {
                                      contentResolver.openFileDescriptor(file.uri, "r")?.use { pfd ->
                                          val exif = ExifInterface(pfd.fileDescriptor)
                                          val latLong = FloatArray(2)
                                          if (exif.getLatLong(latLong)) {
                                              item.lat = latLong[0].toDouble()
                                              item.lon = latLong[1].toDouble()
                                              item.debugStatus = "OK"
                                              editor.putString(cacheKey, "${item.lat},${item.lon}")
                                          } else {
                                              item.debugStatus = "GPSタグなし"
                                              editor.putString(cacheKey, "NO_GPS")
                                          }
                                      }
                                  } catch (e: Exception) {
                                      item.debugStatus = "例外"
                                  }
                              }
                              photoList.add(item)

                              if (idx % 5 == 0 || idx == total - 1) {
                                  withContext(Dispatchers.Main) {
                                      tvImageInfo.text = "写真を解析中... [${idx + 1}/$total]"
                                  }
                              }
                          }
                          editor.apply()
                      }

                      applySort()

                      if (restorePhotoName != null) {
                          val foundIdx = photoList.indexOfFirst { it.name == restorePhotoName }
                          if (foundIdx != -1) {
                              currentIndex = foundIdx
                              displayPhoto(currentIndex)
                          }
                      }
                  }
              }

              private fun applySort() {
                  if (photoList.isEmpty()) return
                  val currentItem = photoList.getOrNull(currentIndex)
                  if (isSortDesc) {
                      photoList.sortByDescending { it.lastModified }
                  } else {
                      photoList.sortBy { it.lastModified }
                  }

                  if (currentItem != null) {
                      val newIndex = photoList.indexOfFirst { it.uri == currentItem.uri }
                      currentIndex = if (newIndex != -1) newIndex else 0
                  }
                  displayPhoto(currentIndex)
              }

              private fun navigateTo(newIndex: Int) {
                  if (photoList.isEmpty()) return
                  if (newIndex in photoList.indices) {
                      currentIndex = newIndex
                      displayPhoto(currentIndex)
                  }
              }

              private fun displayPhoto(index: Int) {
                  val item = photoList[index]

                  getSharedPreferences("app_settings", Context.MODE_PRIVATE)
                      .edit().putString("last_photo_name", item.name).apply()

                  val cacheKey = "${item.uri}_main"
                  val cachedBmp = memoryCache.get(cacheKey)
                  if (cachedBmp != null) {
                      ivThumbnail.setImageBitmap(cachedBmp)
                  } else {
                      lifecycleScope.launch(Dispatchers.IO) {
                          val bmp = decodeSampledBitmap(item.uri, 800, 800)
                          if (bmp != null) {
                              memoryCache.put(cacheKey, bmp)
                              withContext(Dispatchers.Main) {
                                  if (currentIndex == index) {
                                      ivThumbnail.setImageBitmap(bmp)
                                  }
                              }
                          }
                      }
                  }

                  val gpsText = if (item.lat != null && item.lon != null) {
                      "GPS: ${"%.6f".format(item.lat)}, ${"%.6f".format(item.lon)}"
                  } else {
                      "GPS: なし (${item.debugStatus})"
                  }
                  tvImageInfo.text = "[${index + 1}/${photoList.size}] ${item.name}\n$gpsText"

                  val canGoNewer = if (isSortDesc) index > 0 else index < photoList.size - 1
                  val canGoOlder = if (isSortDesc) index < photoList.size - 1 else index > 0

                  btnNewer.isEnabled = canGoNewer
                  btnOlder.isEnabled = canGoOlder

                  val hasGps = (item.lat != null && item.lon != null)
                  btnGsi.isEnabled = hasGps
                  btnGoogleMap.isEnabled = hasGps

                  renderCurrentPhotoOnMap()
              }

              private fun renderCurrentPhotoOnMap() {
                  if (!isMapReady || photoList.isEmpty()) return

                  val current = photoList[currentIndex]
                  val jsonArray = JSONArray()

                  val targets = if (pinLimitCount > 0) photoList.take(pinLimitCount) else photoList

                  targets.forEach { p ->
                      if (p.lat != null && p.lon != null) {
                          val originalIndex = photoList.indexOf(p)
                          val obj = JSONObject().apply {
                              put("index", originalIndex)
                              put("lat", p.lat)
                              put("lon", p.lon)
                              put("hasGps", true)
                              put("isCurrent", originalIndex == currentIndex)
                          }
                          jsonArray.put(obj)
                      }
                  }

                  val hasCoords = current.lat != null && current.lon != null
                  val lat = current.lat ?: 0.0
                  val lon = current.lon ?: 0.0

                  mapWebView.evaluateJavascript(
                      "updatePoints($lat, $lon, $hasCoords, '${jsonArray}', $currentIndex);",
                      null
                  )
              }

              private fun openInGsiMap() {
                  val item = photoList.getOrNull(currentIndex) ?: return
                  val lat = item.lat ?: return
                  val lon = item.lon ?: return
                  val url = "https://maps.gsi.go.jp/#18/${lat}/${lon}/"
                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
              }

              private fun openInGoogleMap() {
                  val item = photoList.getOrNull(currentIndex) ?: return
                  val lat = item.lat ?: return
                  val lon = item.lon ?: return
                  val uri = Uri.parse("geo:$lat,$lon?q=$lat,$lon(撮影地点)")
                  val intent = Intent(Intent.ACTION_VIEW, uri).apply {
                      setPackage("com.google.android.apps.maps")
                  }
                  try {
                      startActivity(intent)
                  } catch (e: Exception) {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://maps.google.com/?q=$lat,$lon")))
                  }
              }

              inner class WebAppInterface {
                  @JavascriptInterface
                  fun onMarkerClicked(index: Int) {
                      runOnUiThread {
                          if (index >= 0) {
                              navigateTo(index)
                          }
                      }
                  }
              }
          }
          EOF

      - name: APKのビルド
        run: gradle assembleDebug --stacktrace

      - name: 完成したAPKをアーティファクトに保存
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMapViewer-APK
          path: app/build/outputs/apk/debug/*.apk
